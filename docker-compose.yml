services:
  app:
    build: .
    expose:
      - "8000"
    volumes:
      - claim_data:/app/src/data
      - claim_logs:/app/src/logs
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  claim_data:
  claim_logs:
