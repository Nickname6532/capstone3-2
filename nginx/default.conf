# 프론트(정적 대시보드)와 백엔드(FastAPI API)를 하나의 진입점(80번 포트)으로 통합한다.
# 실제로는 FastAPI 자체가 /static을 서빙하지만, 외부에는 nginx 하나만 노출해서
# 나중에 TLS 종료, 캐싱, 레이트리밋 등을 nginx 쪽에 추가하기 쉽게 한다.

upstream backend {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;  # 일괄 가져오기 엑셀/CSV 업로드 고려

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
