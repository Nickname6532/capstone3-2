<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>클레임 접수</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  main.narrow { max-width: 480px; }
  .success { display: none; text-align: center; padding: 40px 10px; }
  .success .icon { font-size: 40px; }
  .claim-id { font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>클레임 접수</h1>
</header>

<main class="narrow">
  <section class="panel" id="form-panel">
    <p style="color: var(--muted); margin-top: 0;">불편사항을 남겨주시면 담당자가 확인 후 처리해 드립니다.</p>
    <form id="public-claim-form">
      <label>업체/성함 <input name="customer" required /></label>
      <label>연락처 <input name="contact" required placeholder="010-0000-0000" /></label>
      <label>제품/모델 <input name="product" required /></label>
      <label>불편 내용
        <textarea name="description" rows="4" required placeholder="어떤 문제가 있으셨는지 적어주세요"></textarea>
      </label>
      <button type="submit">접수하기</button>
    </form>
  </section>

  <section class="panel success" id="success-panel">
    <div class="icon">✅</div>
    <p>접수가 완료되었습니다.</p>
    <p>접수번호 <span class="claim-id" id="result-claim-id"></span></p>
    <p style="color: var(--muted); font-size: 13px;">담당자 확인 후 순차적으로 연락드립니다.</p>
  </section>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const channel = params.get("channel") === "app" ? "앱" : "웹";

  const form = document.getElementById("public-claim-form");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    payload.channel = channel;
    payload.amount_krw = 0;

    const btn = form.querySelector("button");
    btn.disabled = true;
    btn.textContent = "접수 중...";

    try {
      const res = await fetch("/api/public/claims", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json();
        alert("접수 실패: " + (err.detail ? JSON.stringify(err.detail) : res.status));
        btn.disabled = false;
        btn.textContent = "접수하기";
        return;
      }
      const row = await res.json();
      document.getElementById("result-claim-id").textContent = row.claim_id;
      document.getElementById("form-panel").style.display = "none";
      document.getElementById("success-panel").style.display = "block";
    } catch (err) {
      alert("네트워크 오류로 접수에 실패했습니다.");
      btn.disabled = false;
      btn.textContent = "접수하기";
    }
  });
</script>
</body>
</html>
