<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>계정 관리</title>
<link rel="stylesheet" href="/static/style.css?v=17" />
</head>
<body>
<header class="page-head">
  <h1>계정 관리</h1>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>새 계정 만들기</h2>
      <p class="hint">아이디는 영문, 숫자, ., _ 로 3~32자. 비밀번호는 숫자와 문자를 섞어 10자 이상.</p>
    </div>
    <form id="create-form">
      <div class="row">
        <label>아이디 <input name="username" required /></label>
        <label>표시 이름 <input name="display_name" placeholder="홍길동" /></label>
      </div>
      <div class="row">
        <label>비밀번호 <input name="password" type="password" required /></label>
        <label>권한
          <select name="role">
            <option value="staff" selected>staff (담당자)</option>
            <option value="admin">admin (관리자)</option>
          </select>
        </label>
      </div>
      <button type="submit" class="primary">계정 생성</button>
    </form>
    <p id="create-result" class="result-line"></p>
  </section>

  <section class="panel">
    <h2>계정 목록</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>아이디</th><th>표시 이름</th><th>권한</th><th>상태</th><th>생성일</th><th>최근 로그인</th><th>액션</th></tr>
        </thead>
        <tbody id="accounts-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/common.js?v=2"></script>
<script>
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  async function requireAdmin() {
    const res = await fetch("/api/auth/me");
    if (!res.ok) { location.href = "/login"; return null; }
    const me = await res.json();
    if (me.role !== "admin") { location.href = "/"; return null; }
    return me;
  }

  async function loadAccounts() {
    const res = await fetch("/api/admin/accounts");
    if (res.status === 401) { location.href = "/login"; return; }
    const accounts = await res.json();
    document.getElementById("accounts-body").innerHTML = accounts.map(a => `
      <tr data-username="${escapeHtml(a.username)}">
        <td class="num">${escapeHtml(a.username)}</td>
        <td>${escapeHtml(a.display_name || "-")}</td>
        <td>${escapeHtml(a.role)}</td>
        <td>${a.is_active ? "활성" : "비활성"}${a.locked_until ? ", 잠김" : ""}</td>
        <td class="num">${escapeHtml(a.created_at)}</td>
        <td class="num">${escapeHtml(a.last_login_at || "-")}</td>
        <td class="actions">
          <button type="button" class="toggle-active-btn">${a.is_active ? "비활성화" : "활성화"}</button>
          <button type="button" class="unlock-btn">잠금 해제</button>
          <button type="button" class="reset-pw-btn">비밀번호 초기화</button>
        </td>
      </tr>
    `).join("");

    document.querySelectorAll("#accounts-body tr").forEach(tr => {
      const username = tr.dataset.username;
      const account = accounts.find(a => a.username === username);

      tr.querySelector(".toggle-active-btn").addEventListener("click", async () => {
        const nextActive = !account.is_active;
        if (!confirm(`'${username}' 계정을 ${nextActive ? "활성화" : "비활성화"}할까요?`)) return;
        await fetch(`/api/admin/accounts/${username}`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ is_active: nextActive }),
        });
        await loadAccounts();
      });

      tr.querySelector(".unlock-btn").addEventListener("click", async () => {
        await fetch(`/api/admin/accounts/${username}/unlock`, { method: "POST" });
        await loadAccounts();
      });

      tr.querySelector(".reset-pw-btn").addEventListener("click", async () => {
        const newPassword = prompt(`'${username}'의 새 비밀번호 (10자 이상, 숫자+문자 혼합)`);
        if (!newPassword) return;
        const res = await fetch(`/api/admin/accounts/${username}/reset-password`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ new_password: newPassword }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert(err.detail || "초기화 실패");
          return;
        }
        alert("비밀번호가 초기화되었습니다.");
      });
    });
  }

  document.getElementById("create-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    const resultEl = document.getElementById("create-result");
    resultEl.textContent = "";
    resultEl.style.color = "";

    const res = await fetch("/api/admin/accounts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      resultEl.textContent = err.detail || "생성 실패";
      resultEl.style.color = "var(--danger)";
      return;
    }
    const account = await res.json();
    resultEl.textContent = `${account.username} 계정이 생성되었습니다.`;
    resultEl.style.color = "var(--ok-ink)";
    form.reset();
    await loadAccounts();
  });

  (async () => {
    const me = await requireAdmin();
    if (me) await loadAccounts();
  })();
</script>
</body>
</html>
