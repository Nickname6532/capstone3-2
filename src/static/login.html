<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인</title>
<link rel="stylesheet" href="/static/style.css?v=4" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { width: 100%; max-width: 360px; padding: 0 16px; }
  .login-box h1 { font-size: 18px; margin: 0 0 4px; }
  .login-box .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  .error-msg { color: var(--coral); font-size: 13px; margin: 0 0 12px; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <h1>클레임 통합관리 시스템</h1>
  <p class="sub">담당자 계정으로 로그인하세요</p>
  <div class="panel">
    <p class="error-msg" id="error-msg"></p>
    <form id="login-form">
      <label>아이디 <input name="username" required autocomplete="username" /></label>
      <label>비밀번호 <input name="password" type="password" required autocomplete="current-password" /></label>
      <button type="submit" class="primary">로그인</button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("error-msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());

    const btn = form.querySelector("button");
    btn.disabled = true;
    btn.textContent = "확인 중...";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        errorEl.textContent = err.detail || "로그인에 실패했습니다.";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "로그인";
        return;
      }
      location.href = "/";
    } catch (err) {
      errorEl.textContent = "네트워크 오류가 발생했습니다.";
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "로그인";
    }
  });
</script>
</body>
</html>
